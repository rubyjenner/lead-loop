services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadloop}
      POSTGRES_DB: ${POSTGRES_DB:-leadloop}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leadloop}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-leadloop}:${POSTGRES_PASSWORD:-leadloop}@db:5432/${POSTGRES_DB:-leadloop}
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ characters)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_PROVIDERS: ${AI_PROVIDERS:-claude,gemini}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PROXY_HEADER: ${PROXY_HEADER:-}
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata: